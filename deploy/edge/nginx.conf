worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server_tokens off;
    client_max_body_size 250m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;

    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;

    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /run/secrets/tls_certificate;
        ssl_certificate_key /run/secrets/tls_private_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ${OIDC_BROWSER_ORIGIN}; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self' ${OIDC_BROWSER_ORIGIN}" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location = /healthz { access_log off; return 200 "ok\n"; }
        location ~ ^/api/v1/(internal|metrics) { return 404; }
        location /api/ {
            limit_req zone=api_per_ip burst=40 nodelay;
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 65s;
            proxy_request_buffering off;
        }
        location / {
            try_files $uri /index.html;
        }
    }
}

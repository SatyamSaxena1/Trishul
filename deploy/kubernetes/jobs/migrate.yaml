apiVersion: batch/v1
kind: Job
metadata:
  generateName: trishul-migrate-
  namespace: ai-trishul
  labels:
    app.kubernetes.io/name: trishul-migrate
    app.kubernetes.io/part-of: ai-trishul
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trishul-migrate
        app.kubernetes.io/part-of: ai-trishul
    spec:
      serviceAccountName: trishul-worker
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: TRISHUL_APP_IMAGE
          imagePullPolicy: IfNotPresent
          command: [python, manage.py, migrate, --noinput]
          envFrom:
            - configMapRef: { name: trishul-config }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - { name: runtime-secrets, mountPath: /run/secrets, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: runtime-secrets
          secret: { secretName: trishul-runtime-secrets, defaultMode: 0444 }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }

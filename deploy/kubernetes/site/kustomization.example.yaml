apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - path: config.patch.example.yaml
images:
  - name: registry.example.internal/ai-trishul
    newName: registry.customer.internal/ai-trishul
    digest: sha256:REPLACE_WITH_64_HEX_CHARACTERS
  - name: registry.example.internal/ai-trishul-analyzer
    newName: registry.customer.internal/ai-trishul-analyzer
    digest: sha256:REPLACE_WITH_64_HEX_CHARACTERS
  - name: registry.example.internal/ai-trishul-edge
    newName: registry.customer.internal/ai-trishul-edge
    digest: sha256:REPLACE_WITH_64_HEX_CHARACTERS

apiVersion: v1
kind: ServiceAccount
metadata:
  name: trishul-api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trishul-worker
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trishul-analysis-controller
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: trishul-analysis-controller
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create, get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trishul-analysis-controller
subjects:
  - kind: ServiceAccount
    name: trishul-analysis-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: trishul-analysis-controller


apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - route.yaml
patches:
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: trishul
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: trishul


name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: trishul
          POSTGRES_USER: trishul_owner
          POSTGRES_PASSWORD: owner-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trishul_owner -d trishul"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check backend analyzer
      - name: Test Python and validate OSCAL 1.1.2 export
        env:
          OSCAL_SCHEMA_PATH: ${{ runner.temp }}/oscal_assessment-results_schema.json
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/usnistgov/OSCAL/releases/download/v1.1.2/oscal_assessment-results_schema.json \
            --output "$OSCAL_SCHEMA_PATH"
          pytest
      - name: Verify PostgreSQL RLS and integrity
        env:
          OWNER_DSN: postgresql://trishul_owner:owner-test-password@localhost:5432/trishul
          APP_DSN: postgresql://trishul_app:app-test-password@localhost:5432/trishul
          DEBUG: "true"
          DJANGO_SECRET_KEY: test-only-key
          DB_HOST: localhost
          DB_NAME: trishul
          DB_USER: trishul_owner
          DB_PASSWORD: owner-test-password
          DB_SSLMODE: disable
        run: |
          python -c "import psycopg; c=psycopg.connect('$OWNER_DSN', autocommit=True); c.execute(\"CREATE ROLE trishul_app LOGIN PASSWORD 'app-test-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT\"); c.close()"
          python backend/manage.py migrate --noinput
          python scripts/verify_postgres_security.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm audit
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build
      - run: docker compose --env-file .env.example config --quiet
      - uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
        with:
          version: v1.34.1
      - run: kubectl kustomize deploy/kubernetes/base >/dev/null
      - run: kubectl kustomize deploy/kubernetes/openshift >/dev/null
      - run: cp deploy/kubernetes/aws/aws.env.example deploy/kubernetes/aws/aws.env && kubectl kustomize deploy/kubernetes/aws >/dev/null
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.13.5"
      - working-directory: deploy/aws
        run: terraform fmt -check && terraform init -backend=false && terraform validate && terraform test
      - run: sh -n bin/trishulctl bin/trishulkube
      - name: Verify the deployment gate client is self-contained
        run: |
          python -m py_compile bin/trishul-gate
          python bin/trishul-gate --help >/dev/null

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: docker build --target app -t ai-trishul:test .
      - run: docker build --target controller -t ai-trishul-controller:test .
      - run: docker build -f analyzer/Dockerfile -t ai-trishul-analyzer:test .
      - run: docker build -f deploy/edge/Dockerfile -t ai-trishul-edge:test .
